name: safe-sphere-ai

services:
  postgres:
    image: postgres:18
    container_name: safe-sphere-ai-postgres
    environment:
      POSTGRES_DB: safe-sphere-ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - safe-sphere-ai_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  safe-sphere-ai_postgres_data:
